name: flutter_location_button
description: "Displays a system-rendered Location Button (on Android 17+) with fallback"
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.3.0
  material_symbols_icons: ^4.2960.0
  material_ui: ^1.5.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^29.0.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: fr.antinote.flutter_location_button
        pluginClass: FlutterLocationButtonPlugin